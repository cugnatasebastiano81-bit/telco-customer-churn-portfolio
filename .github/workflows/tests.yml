name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned environment
        run: python -m pip install -r requirements-lock.txt
      - name: Run unit and end-to-end tests
        run: python -m pytest
